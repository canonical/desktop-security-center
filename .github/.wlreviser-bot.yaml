weblate:
  api_url: https://hosted.weblate.org/api/
  project: ubuntu-desktop-translations

github:
  repository: canonical/desktop-security-center

ai:
  api_url: https://openrouter.ai/api/v1
  model: google/gemini-3.8-flash

components:
  - weblate_component: desktop-security-center
    source_locale: en
    context_locales: [de, fr, es]
    format: arb
    source_file: packages/security_center/lib/l10n/app_en.arb
    path: packages/security_center/lib/l10n/app_{locale}.arb
    push_after_commit: false