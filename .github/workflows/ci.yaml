name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos generate
      - run: melos analyze --fatal-infos

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos format:exclude

  l10n:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos generate
      - run: melos gen-l10n
      - name: Check for outdated l10n
        if: github.event_name == 'pull_request'
        run: ./scripts/check-outdated-files.sh
      - name: Create PR
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            **/l10n/*.dart
            snap/gui/desktop-security-center.desktop
          title: 'chore: regenerate l10n'
          commit-message: 'chore: regenerate l10n'
          branch: create-pull-request/l10n
          delete-branch: true

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: sudo apt update && sudo apt install -y lcov
      - run: melos generate
      - run: melos coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install dependencies for TICS analysis
        if: github.event_name == 'push'
        run: sudo apt update && sudo apt install -y clang cmake libglib2.0-dev libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Build flutter packages for TICS analysis
        if: github.event_name == 'push'
        run: melos build

      - name: Run TICS analysis
        if: github.event_name == 'push'
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: desktop-security-center
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true

  security-center:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos generate
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y clang cmake libglib2.0-dev libgtk-3-dev liblzma-dev ninja-build pkg-config polkitd xvfb ubuntu-advantage-desktop-daemon update-notifier
      - name: Setup apparmor prompting
        run: |
          sudo snap install snapd --channel=latest/edge
          sudo snap install prompting-client
          sudo snap set system experimental.apparmor-prompting=true
      - name: Setup polkit rules
        run: sudo install -m 0644 packages/security_center/integration_test/assets/snapd-ci.rules /etc/polkit-1/rules.d/49-snapd-ci.rules
      - name: Run integration tests
        working-directory: packages/security_center
        run: xvfb-run -a -s '-screen 0 1024x768x24 +extension GLX' flutter test integration_test
